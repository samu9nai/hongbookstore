name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: JDK 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6

      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프론트엔드 검사
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # 바뀐 파일을 비교 기준 커밋과 견주어야 해서 전체 이력이 필요하다.
          fetch-depth: 0

      - name: pnpm 설정
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 서식 검사
        run: pnpm format:check

      - name: 타입 검사
        run: pnpm type-check

      # 기존 코드에 린트 오류가 남아 있어(AGENTS.md 기준선) 전체 린트는 실패한다.
      # pre-commit 훅과 같은 기준으로, 이 변경에서 추가·수정한 JS·TS 파일만 검사한다.
      - name: 바뀐 파일 린트
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "비교 기준 커밋($BASE_SHA)이 없어 전체 린트 결과만 요약합니다."
            pnpm lint || true
            exit 0
          fi
          changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- frontend)
          # grep은 일치하는 줄이 없으면 1로 끝난다. 파일이 없는 경우만 0으로 바꾼다.
          files=$(printf '%s\n' "$changed" | { grep -E '\.(ts|tsx|js|jsx|mjs|cjs)$' || true; } | sed 's|^frontend/||')
          if [ -z "$files" ]; then
            echo "바뀐 프론트엔드 JS·TS 파일이 없습니다."
            exit 0
          fi
          echo "검사할 파일:"
          printf '%s\n' "$files" | sed 's/^/  /'
          cd frontend
          printf '%s\n' "$files" | tr '\n' '\0' | xargs -0 pnpm exec oxlint --type-aware --max-warnings=0

      - name: 단위 테스트
        run: pnpm test:unit --run

      - name: 프로덕션 빌드
        run: pnpm build

  e2e:
    name: 프론트엔드 e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: pnpm 설정
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Playwright 브라우저 캐시
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # 캐시가 맞아도 시스템 라이브러리는 매번 설치해야 해서 --with-deps를 둔다.
      - name: Playwright 브라우저 설치
        run: pnpm --filter @hongbookstore/frontend exec playwright install --with-deps chromium

      # 빌드와 preview 서버 기동은 playwright.config.ts의 webServer가 맡는다.
      # GitHub Actions가 넣어 주는 CI 환경 변수로 preview 모드가 켜진다.
      - name: e2e 테스트
        run: pnpm test:e2e

      - name: 실패 시 실행 기록 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results
          retention-days: 7
